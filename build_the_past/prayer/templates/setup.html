<style>
    body {
    font-family: "Tahoma", Arial, sans-serif;
    background: linear-gradient(to bottom, #f5f7fa, #e6f0ea);
    margin: 0;
    padding: 0;
    direction: rtl; /* لأن الصفحة بالعربية */
}

form {
    max-width: 400px;
    margin: 80px auto;
    background: white;
    padding: 30px;
    border-radius: 14px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
}

h2 {
    text-align: center;
    color: #2f855a;
    font-size: 26px;
    margin-bottom: 25px;
}

form p {
    margin-bottom: 15px;
    font-size: 16px;
    color: #2d3748;
}

input[type="date"], input[type="text"], textarea {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    border-radius: 8px;
    border: 1px solid #cbd5e0;
    font-size: 16px;
    box-sizing: border-box;
}

button {
    width: 100%;
    padding: 12px;
    background-color: #2f855a;
    color: white;
    font-size: 18px;
    font-weight: bold;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background-color: #276749;
}

</style>
<h2>إضافة جلسة قضاء الصلاة</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">إضافة</button>
</form>
